name: Build Windows installer and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Pre-create the (published) release in the releases repo so electron-builder
      # only UPLOADS assets to it — avoids the race where parallel asset uploads
      # each try to create the release and one 422s ("tag already exists").
      # Reset any prior release+tag first so re-runs are idempotent.
      - name: Prepare release in releases repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          REPO=Jaydeepsaha2003/rishabh-oil-releases
          gh release delete "$VERSION" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || echo "no existing release"
          gh api --method DELETE "repos/$REPO/git/refs/tags/$VERSION" 2>/dev/null || echo "no dangling tag"
          gh release create "$VERSION" --repo "$REPO" --target main --title "$VERSION" --notes "Automated release $VERSION"

      - name: Build and publish installer to releases repo
        run: npm run release:win
        env:
          MAIN_VITE_TURSO_DATABASE_URL: ${{ secrets.MAIN_VITE_TURSO_DATABASE_URL }}
          MAIN_VITE_TURSO_AUTH_TOKEN: ${{ secrets.MAIN_VITE_TURSO_AUTH_TOKEN }}
          # PAT with contents:write on Jaydeepsaha2003/rishabh-oil-releases.
          # electron-builder publishes the installer + latest.yml (auto-update feed) there.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rishabh-Oil-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
