name: Build Windows installer and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # electron-builder publishes a PUBLISHED (non-draft) release, which GitHub
      # only allows for an existing tag. The tag lives in the source repo, not the
      # releases repo, so create it there (pointing at the releases repo's default
      # branch) before publishing.
      - name: Ensure release tag exists in releases repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          SHA=$(gh api repos/Jaydeepsaha2003/rishabh-oil-releases/git/refs/heads/main --jq .object.sha)
          gh api --method POST repos/Jaydeepsaha2003/rishabh-oil-releases/git/refs \
            -f ref="refs/tags/$VERSION" -f sha="$SHA" 2>/dev/null || echo "tag $VERSION already exists"

      - name: Build and publish installer to releases repo
        run: npm run release:win
        env:
          MAIN_VITE_TURSO_DATABASE_URL: ${{ secrets.MAIN_VITE_TURSO_DATABASE_URL }}
          MAIN_VITE_TURSO_AUTH_TOKEN: ${{ secrets.MAIN_VITE_TURSO_AUTH_TOKEN }}
          # PAT with contents:write on Jaydeepsaha2003/rishabh-oil-releases.
          # electron-builder publishes the installer + latest.yml (auto-update feed) there.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rishabh-Oil-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
